name: fanclub_app
description: Fanclub application

publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # =========================
  # Routing / State / UI
  # =========================
  go_router: ^13.2.5
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  convex_bottom_bar: ^3.2.0
  table_calendar: ^3.0.9
  intl: ^0.20.2
  kf_drawer: ^2.0.0
  flutter_markdown: ^0.7.3

  # =========================
  # Web / External
  # =========================
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0

  # =========================
  # Device / App Info
  # =========================
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.3
  csv: ^6.0.0

  # =========================
  # Firebase
  # =========================
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.10
  firebase_remote_config: ^5.0.0

  # =========================
  # Auth
  # =========================
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # =========================
  # Notification
  # =========================
  flutter_local_notifications: ^17.2.4

  # =========================
  # freezed（必須）
  # =========================
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

  # code generation
  build_runner: ^2.5.4
  freezed: ^2.5.8

  # =========================
  # App Icon Generator
  # =========================
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/SHAKILAMO_profile.JPG
    - assets/images/SHAKILAMO.JPG
    - assets/images/shakilamo_logo.png
    - assets/images/image_stage_plus.png

# =========================
# App Icon Settings
# =========================
flutter_icons:
  android: true
  ios: true
  image_path: assets/images/image_stage_plus.png
